<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Language Translation Tool</h1>
            <p>Translate text between multiple languages instantly</p>
        </header>

        <div class="translator-card">
            <div class="language-selector">
                <div class="selector-group">
                    <label for="source-lang">From</label>
                    <select id="source-lang">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="zh">Chinese</option>
                        <option value="ar">Arabic</option>
                        <option value="hi">Hindi</option>
                        <option value="bn">Bengali</option>
                    </select>
                </div>

                <button id="swap-btn" class="swap-btn" title="Swap languages">⇄</button>

                <div class="selector-group">
                    <label for="target-lang">To</label>
                    <select id="target-lang">
                        <option value="es">Spanish</option>
                        <option value="en">English</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="zh">Chinese</option>
                        <option value="ar">Arabic</option>
                        <option value="hi">Hindi</option>
                        <option value="bn">Bengali</option>
                    </select>
                </div>
            </div>

            <div class="text-areas">
                <div class="input-section">
                    <textarea id="source-text" placeholder="Enter text to translate..." maxlength="5000"></textarea>
                    <div class="controls">
                        <span id="char-count">0 / 5000</span>
                        <button id="clear-btn" class="icon-btn" title="Clear">✕</button>
                    </div>
                </div>

                <div class="output-section">
                    <textarea id="translated-text" placeholder="Translation will appear here..." readonly></textarea>
                    <div class="controls">
                        <button id="copy-btn" class="icon-btn" title="Copy translation">📋</button>
                        <button id="speak-btn" class="icon-btn" title="Text to speech">🔊</button>
                    </div>
                </div>
            </div>

            <button id="translate-btn" class="translate-btn">
                <span id="btn-text">Translate</span>
                <span id="btn-loader" class="loader hidden"></span>
            </button>

            <div id="error-msg" class="error-msg hidden"></div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <h2>Translation History</h2>
                <button id="clear-history-btn" class="clear-history-btn">Clear All</button>
            </div>
            <div id="history-list" class="history-list">
                <p class="no-history">No translation history yet</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
